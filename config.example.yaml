mode: "development"
port: "8080"

log:
  logPath: "./latest.log"
  cls:
    endpoint: ""
    accessKey: ""
    accessToken: ""
    topicID: ""

# Keep empty by default. Configure via a secret manager or environment variable in production.
sentryDsn: ""

jin:
  readHeaderTimeout: "5s"
  readTimeout: "30s"
  writeTimeout: "30s"
  idleTimeout: "60s"
  shutdownTimeout: "10s"

sql:
  driver: "postgres"
  # No secret is provided in the example. Set this from a protected runtime config.
  dsn: ""
  debug: false
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxLifetime: "30m"

git:
  storageRoot: "./var/marketplace/git"
  validatorBinary: "claude"

backend:
  # Keep empty. MARKETPLACE_JWT_SECRET takes precedence and must be set in production.
  jwtSecret: ""
  # Public account registration is disabled unless explicitly enabled by the operator.
  registrationEnabled: false

frontend:
  disabled: false
  basePath: "/"
