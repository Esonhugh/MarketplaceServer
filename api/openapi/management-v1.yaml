openapi: 3.1.0
info:
  title: MarketplaceServer Management API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Authoritative wire contract for currently implemented management operations
    under `/api/v1`.

    This document models deployed behavior only. `GET /api/v1/health` and
    `GET /api/v1/me/tokens` currently return direct success payloads; the token
    list currently uses cursor pagination. Target contracts are documented in
    `management-v1-design.yaml` and are not implemented by this schema.
    Errors remain direct objects.

    Git Smart HTTP, distribution endpoints, frontend routes, and the external
    Claude Code `marketplace.json` schema are outside this contract.
  x-document-status: approved
  x-implementation-conformance: partial
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin MarketplaceServer deployment

tags:
  - name: Health
    description: Management-plane process health.
  - name: Personal access tokens
    description: Personal access token lifecycle for the authenticated user.

paths:
  /api/v1/health:
    get:
      operationId: getManagementHealth
      tags:
        - Health
      summary: Get backend health
      description: |
        Returns the currently implemented unauthenticated backend health response.
        The handler currently reports a static `ok` backend check; it is not a
        database or Git readiness probe.

        This deployed response is the direct `Health` object. The proposed
        contract uses `{ "data": <Health> }`; changing the handler requires a
        separately approved compatibility slice.
      security: []
      responses:
        "200":
          description: Current direct health response.
          x-compatibility-debt: Direct success payload; proposed target wraps Health in data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImplementedManagementHealth"
              examples:
                implementedBackendHealth:
                  summary: Exact response asserted by the backend route test
                  value:
                    status: ok
                    checks:
                      - name: backend
                        status: ok

  /api/v1/me/tokens:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listPersonalAccessTokens
      tags:
        - Personal access tokens
      summary: List the current user's personal access tokens
      description: |
        Returns an owner-scoped, newest-first page of token metadata. Cursors are
        opaque, integrity-protected, bound to the current user, and must never be
        decoded by clients.

        The deployed handler returns `ListTokensData` directly with cursor
        pagination. The proposed contract uses the common data envelope and
        page/size/total pagination; changing the handler requires a separately
        approved compatibility slice.
      security:
        - BasicAuth: []
      parameters:
        - $ref: "#/components/parameters/TokenListLimit"
        - $ref: "#/components/parameters/TokenListCursor"
      responses:
        "200":
          description: Current direct cursor page of token metadata.
          x-compatibility-debt: Direct cursor payload; proposed target uses an enveloped page/size/total list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTokensData"
              examples:
                pageWithCursor:
                  summary: Metadata-only page with an opaque next cursor
                  value:
                    items:
                      - id: 4b11513f-e003-4fd1-8e73-c573bee65e20
                        name: CI
                        scopes:
                          - repository.read
                        createdAt: "2026-08-10T00:00:00Z"
                    nextCursor: opaque
                emptyPage:
                  summary: Empty pages retain an items array and omit nextCursor
                  value:
                    items: []
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid limit or cursor.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidLimit:
                  value:
                    code: validation_failed
                    message: limit must be a positive integer
                    requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
                invalidCursor:
                  value:
                    code: validation_failed
                    message: request is invalid
                    requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createPersonalAccessToken
      tags:
        - Personal access tokens
      summary: Create a personal access token
      description: |
        Creates a token for the authenticated user. Unknown JSON fields, malformed
        JSON, bodies larger than 65,536 bytes, and a second trailing JSON value are
        rejected. The plaintext token is returned only in this response and must
        not be cached, logged, or persisted by a client.
      security:
        - BasicAuth: []
      requestBody:
        required: true
        description: |
          The documented representation is JSON. The current handler decodes a valid
          JSON body without enforcing the Content-Type header; strict media-type
          enforcement is tracked as implementation conformance debt.
        x-conformance-debt: Current handler does not enforce Content-Type application/json.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
            examples:
              repositoryReadToken:
                value:
                  name: CI
                  scopes:
                    - repository.read
              expiringToken:
                value:
                  name: Temporary automation
                  scopes:
                    - repository.read
                    - plugin.read
                  expiresAt: "2026-12-31T00:00:00Z"
      responses:
        "201":
          description: Token created; plaintext is disclosed once in this response.
          headers:
            Cache-Control:
              description: Prevents storage of the one-time plaintext token.
              required: true
              schema:
                type: string
                const: private, no-store
              example: private, no-store
            Pragma:
              description: Compatibility cache prevention for the one-time plaintext token.
              required: true
              schema:
                type: string
                const: no-cache
              example: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
              examples:
                createdToken:
                  value:
                    data:
                      id: 4b11513f-e003-4fd1-8e73-c573bee65e20
                      name: CI
                      scopes:
                        - repository.read
                      createdAt: "2026-08-10T00:00:00Z"
                      token: mpsk_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The JSON body or requested token properties are invalid.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidBody:
                  value:
                    code: validation_failed
                    message: request body is invalid
                    requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
                invalidTokenProperties:
                  value:
                    code: validation_failed
                    message: request is invalid
                    requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/TokenId"
    delete:
      operationId: revokePersonalAccessToken
      tags:
        - Personal access tokens
      summary: Revoke a personal access token
      description: |
        Revokes an owner-scoped token. Revoking an already revoked token is
        idempotent. Another user's token is indistinguishable from a missing token.

        Production token IDs are canonical UUID strings. The current handler passes
        path text to the service without canonical UUID validation; accepting and
        then returning not found for noncanonical values is implementation
        conformance debt.
      security:
        - BasicAuth: []
      responses:
        "204":
          description: Token revoked successfully; the response body is empty.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication. For current PAT operations, the password slot
        may contain an account password or a valid personal access token. A value
        beginning with `mpsk_` is dispatched as a personal access token rather than
        retried as an account password. PAT authentication also requires the supplied
        username to normalize to the token owner's username. Wrong usernames and
        invalid, expired, revoked, or disabled-owner PATs produce the same 401 response.
        This scheme does not authorize distribution credentials on the management plane.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Optional opaque correlation identifier. The token handler trims the value
        and accepts it when nonempty and at most 128 bytes; otherwise it generates
        a UUID. Token error responses echo the selected value in both the response
        header and error body. Success responses do not currently guarantee an echo.
      schema:
        type: string
        minLength: 1
        x-runtime-maxBytes: 128
        x-runtime-constraint: UTF-8 byte count after trimming; standard JSON Schema length keywords do not enforce this limit.
      example: request-1
    TokenListLimit:
      name: limit
      in: query
      required: false
      description: |
        Requested page size. Defaults to 50. It must be a positive integer; the
        current handler accepts values above 100 and clamps them to 100.
      schema:
        type: integer
        minimum: 1
        default: 50
      example: 50
    TokenListCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque, integrity-protected cursor from `nextCursor`. The current handler
        limits the decoded query string to 1,024 bytes. Clients must not decode it.
      schema:
        type: string
        x-runtime-maxBytes: 1024
        x-runtime-constraint: UTF-8 byte count; standard JSON Schema length keywords do not enforce this limit.
      example: opaque
    TokenId:
      name: tokenId
      in: path
      required: true
      description: |
        Canonical UUID string identifying the token. Production creation generates
        this form. The current delete handler does not validate the format before
        lookup; that implementation gap is tracked as conformance debt.
      schema:
        type: string
        minLength: 1
      x-production-format: canonical lowercase hyphenated UUID
      x-conformance-debt: Current handler does not enforce the production UUID format at this boundary.
      example: 4b11513f-e003-4fd1-8e73-c573bee65e20

  headers:
    RequestId:
      description: Correlation identifier matching the error body's `requestId`.
      required: true
      schema:
        type: string
        minLength: 1
        x-runtime-maxBytes: 128
        x-runtime-constraint: UTF-8 byte count; standard JSON Schema length keywords do not enforce this limit.
      example: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
    WwwAuthenticate:
      description: Basic authentication challenge for the management plane.
      required: true
      schema:
        type: string
        const: Basic realm="MarketplaceServer"
      example: Basic realm="MarketplaceServer"

  responses:
    Unauthenticated:
      description: Basic authentication is missing or invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            authenticationRequired:
              value:
                code: unauthenticated
                message: authentication is required
                requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
    Forbidden:
      description: The authenticated principal is not allowed to perform the operation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            permissionDenied:
              value:
                code: forbidden
                message: permission denied
                requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
    TokenNotFound:
      description: No token owned by the authenticated user has the supplied identifier.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tokenNotFound:
              value:
                code: not_found
                message: token not found
                requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
    InternalError:
      description: An unexpected internal error occurred; implementation details are not exposed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internalError:
              value:
                code: internal_error
                message: internal server error
                requestId: 27efef25-b8ad-4edf-a341-f10f4b4fc7f4

  schemas:
    UUID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Canonical lowercase hyphenated UUID text.
      example: 4b11513f-e003-4fd1-8e73-c573bee65e20

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp.
      example: "2026-08-10T00:00:00Z"

    ImplementedManagementHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          const: ok
        checks:
          type: array
          minItems: 1
          maxItems: 1
          prefixItems:
            - type: object
              additionalProperties: false
              required:
                - name
                - status
              properties:
                name:
                  type: string
                  const: backend
                status:
                  type: string
                  const: ok
          items: false

    TokenScope:
      type: string
      enum:
        - marketplace.read
        - plugin.read
        - repository.read
        - repository.write
        - token.read
        - token.write

    TokenMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - scopes
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          description: Human-readable token name.
          example: CI
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          $ref: "#/components/schemas/Timestamp"
        revokedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    CreatedToken:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - scopes
        - createdAt
        - token
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          description: Human-readable token name.
          example: CI
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        lastUsedAt:
          $ref: "#/components/schemas/Timestamp"
        revokedAt:
          $ref: "#/components/schemas/Timestamp"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^mpsk_[A-Za-z0-9_-]{43}$"
          description: One-time plaintext personal access token, disclosed only at creation.
          example: mpsk_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG

    CreateTokenRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          description: |
            Name trimmed by the service; the trimmed UTF-8 value must be nonempty
            and at most 128 bytes.
          x-runtime-maxBytes: 128
          x-runtime-constraint: Trimmed UTF-8 byte count; whitespace-only values are rejected and standard JSON Schema length keywords do not enforce these rules.
          example: CI
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TokenScope"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Optional expiration strictly later than creation time.

    CreateTokenResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CreatedToken"

    ListTokensData:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TokenMetadata"
        nextCursor:
          type: string
          description: Opaque cursor included only when a subsequent page exists.
          x-runtime-maxBytes: 1024
          x-runtime-constraint: UTF-8 byte count; standard JSON Schema length keywords do not enforce this limit.

    Error:
      type: object
      additionalProperties: false
      description: |
        Direct stable error object. It is never wrapped in `data`. Current token
        handlers omit `details`; the generic helper permits an optional JSON value.
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - validation_failed
        message:
          type: string
          description: Human-readable message; clients must not treat it as an enum.
          examples:
            - request is invalid
        requestId:
          type: string
          minLength: 1
          x-runtime-maxBytes: 128
          x-runtime-constraint: UTF-8 byte count; standard JSON Schema length keywords do not enforce this limit.
          description: Correlation identifier matching the `X-Request-Id` response header.
          examples:
            - 27efef25-b8ad-4edf-a341-f10f4b4fc7f4
        details:
          description: Optional structured details. Current PAT errors do not populate this field.
