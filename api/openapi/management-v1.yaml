openapi: 3.1.0
info:
  title: MarketplaceServer Management API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Authoritative wire contract for currently implemented management operations
    under `/api/v1`.

    This document contains deployed login, health, current-user personal access
    token, Plugin lifecycle, and Plugin Version operations. Future Marketplace,
    team, and distribution credential management paths remain in
    `management-v1-design.yaml` and are not evidence of runtime availability.

    Git Smart HTTP, distribution endpoints, frontend routes, and the external
    Claude Code `marketplace.json` schema are outside this contract.
  x-document-status: approved
  x-implementation-conformance: implemented
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin MarketplaceServer deployment

tags:
  - name: Authentication
    description: Password login and management JWT issuance.
  - name: Health
    description: Management-plane process health.
  - name: Personal access tokens
    description: Personal access token lifecycle for the authenticated user.
  - name: Plugins
    description: User-facing Plugins backed by hidden one-to-one Git repositories.
  - name: Plugin versions
    description: Canonical tag-driven Plugin publication.

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in to the management plane
      description: |
        Verifies an account password and issues a stateless 30-day HS256 JWT.
        Missing, unreadable, malformed, oversized, top-level null, or trailing JSON
        produces 400; invalid credentials produce the same non-disclosing 401 response.
        Unknown JSON properties are currently ignored.
      security: []
      requestBody:
        required: true
        description: |
          The handler decodes JSON but does not currently enforce the Content-Type
          header. Request bodies are limited to 65,536 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A fixed 30-day frontend JWT was issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/health:
    get:
      operationId: getManagementHealth
      tags: [Health]
      summary: Get backend health
      description: |
        Returns the current static backend process check. This endpoint is not a
        database or Git readiness probe.
      security: []
      responses:
        "200":
          description: Current management-plane process health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"

  /api/v1/me/tokens:
    get:
      operationId: listPersonalAccessTokens
      tags: [Personal access tokens]
      summary: List the current user's personal access tokens
      description: |
        Returns an exact owner-scoped page ordered by creation time and ID,
        newest first. Metadata includes active, expired, and revoked tokens but
        never includes plaintext or HMAC secret material.
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Exact owner-scoped token page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPageSuccess"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createPersonalAccessToken
      tags: [Personal access tokens]
      summary: Create a personal access token
      description: |
        Creates an owner-scoped PAT using one cumulative capability preset.
        Unknown JSON properties are currently ignored. The repeatably revealable
        plaintext is returned in this response and is protected from caching.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        description: |
          The handler decodes JSON but does not currently enforce the Content-Type
          header. Request bodies are limited to 65,536 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created with owner-revealable plaintext.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTokenSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      operationId: revokePersonalAccessToken
      tags: [Personal access tokens]
      summary: Revoke an owner-scoped personal access token
      description: |
        Revocation is idempotent. A malformed, noncanonical, missing, or
        other-owner token identifier is intentionally hidden behind the same 404.
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Token revoked idempotently; response body is empty.
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/tokens/{tokenId}/reveal:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    post:
      operationId: revealPersonalAccessToken
      tags: [Personal access tokens]
      summary: Reveal an owner-scoped personal access token
      description: |
        Requires both a management Bearer JWT and the current account password.
        The owner may reveal active, expired, or revoked PAT plaintext. Unknown
        JSON properties are currently ignored and the response is not cacheable.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        description: |
          The handler decodes JSON but does not currently enforce the Content-Type
          header. Request bodies are limited to 65,536 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealTokenRequest"
      responses:
        "200":
          description: Token plaintext and current metadata were returned to its owner.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedTokenSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/RevealUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TokenNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      operationId: listPlugins
      tags: [Plugins]
      summary: List readable Plugins in a namespace
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable namespace-scoped Plugin page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginPageSuccess"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPlugin
      tags: [Plugins]
      summary: Create a Plugin and its hidden shared-ID repository
      description: |
        The lowercase kebab-case name is the immutable Plugin slug and Git path.
        Visibility defaults to public. A 201 is synchronous and is returned only
        after the same-UUID hidden bare repository is initialized with symbolic
        HEAD pointing to main and both aggregate SQL rows are ready. SQL and Git
        remain separate atomic boundaries with explicit compensation.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginRequest"
      responses:
        "201":
          description: Draft Plugin and hidden Repository aggregate created and ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    get:
      operationId: getPlugin
      tags: [Plugins]
      summary: Get Plugin metadata
      security:
        - {}
        - BearerJWT: []
      responses:
        "200":
          description: Exact public active/archived metadata is anonymous; draft/private require authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSuccess"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:archive:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: archivePlugin
      tags: [Plugins]
      summary: Archive a Plugin idempotently
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Plugin is archived or was already archived; no body.
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:restore:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: restorePlugin
      tags: [Plugins]
      summary: Restore an archived Plugin to its prior lifecycle state
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Plugin restored to its recorded draft or active state; no body.
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:set-visibility:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: setPluginVisibility
      tags: [Plugins]
      summary: Set current Plugin visibility idempotently
      description: Existing Marketplace index configuration is not rewritten; current content access always re-evaluates plugin.read.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPluginVisibilityRequest"
      responses:
        "204":
          description: Visibility set or already equal; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    get:
      operationId: listPluginVersions
      tags: [Plugin versions]
      summary: List available logical tag Versions
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable page excluding deleted tombstones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionPageSuccess"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions:publish:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: publishPluginVersion
      tags: [Plugin versions]
      summary: Publish an existing canonical v-prefixed SemVer tag
      description: |
        Strictly revalidates the current canonical tag, exact manifest name and
        full SHA. CAS publication creates or restores the same logical Plugin+tag
        Version. The first successful publish activates a draft Plugin.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPluginVersionRequest"
      responses:
        "201":
          description: Logical Version published at its CAS-verified current SHA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions/{tag}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
      - $ref: "#/components/parameters/TagName"
    get:
      operationId: getPluginVersion
      tags: [Plugin versions]
      summary: Get an exact logical Version
      security:
        - {}
        - BearerJWT: []
      responses:
        "200":
          description: Available Version metadata under current Plugin visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionSuccess"
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions/{tag}:set-default:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
      - $ref: "#/components/parameters/TagName"
    post:
      operationId: setDefaultPluginVersion
      tags: [Plugin versions]
      summary: Set the owner-selected default Version
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Available tag is now default or already was; no body.
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/default-version:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    delete:
      operationId: clearDefaultPluginVersion
      tags: [Plugin versions]
      summary: Clear the owner-selected default Version idempotently
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Default is clear or was already empty; no body.
        "401":
          $ref: "#/components/responses/BearerUnauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Stateless management JWT signed with HS256. Issued tokens contain exactly
        canonical username, iat, and exp claims and have a fixed 30-day lifetime.
        Account passwords and PATs are not accepted as management Bearer tokens.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: One-based page number; defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: Page size; defaults to 20 and must not exceed 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TokenId:
      name: tokenId
      in: path
      required: true
      description: Canonical lowercase hyphenated UUID identifying the PAT.
      schema:
        $ref: "#/components/schemas/UUID"

    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    PluginSlug:
      name: plugin
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    TagName:
      name: tag
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalVersionTag"
  headers:
    RequestId:
      description: Framework-generated ULID matching the error body's requestId.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    BearerChallenge:
      description: Management Bearer authentication challenge.
      schema:
        type: string
        const: 'Bearer realm="MarketplaceServer Management"'
    SecretCacheControl:
      description: Prevents storage of a secret-bearing response.
      schema:
        type: string
        const: private, no-store
    SecretPragma:
      description: Compatibility cache prevention for a secret-bearing response.
      schema:
        type: string
        const: no-cache

  responses:
    BadRequest:
      description: The body is missing, unreadable, malformed, oversized, top-level null, or contains a trailing JSON value.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: bad_request
            message: request body is invalid
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    AuthenticationFailed:
      description: Account credentials are invalid; no credential detail is disclosed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: authentication failed
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    BearerUnauthenticated:
      description: The management Bearer JWT is missing or invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: authentication is required
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    RevealUnauthenticated:
      description: |
        The management Bearer JWT is missing or invalid, or the password
        confirmation failed. Bearer-authentication failures include
        `WWW-Authenticate`; password-confirmation failures omit it. The response
        header is therefore optional.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The authenticated principal is not authorized for this action and resource.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: permission denied
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    TokenNotFound:
      description: The token is malformed, missing, noncanonical, or not owned by the current user.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: token not found
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    NotFound:
      description: The scoped resource was not found or is intentionally not disclosed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource state, version, or unique identity conflicts with the command.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The authorized exact logical Version is retained only as a deleted tombstone; no deleted metadata is disclosed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Query syntax or token input violates the documented constraints.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: request is invalid
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT
    InternalError:
      description: Internal failure without implementation detail disclosure.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: internal server error
            requestId: 01J51X8R6M4B9D5VYN2Q3H7KCT

  schemas:
    UUID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      description: Canonical lowercase hyphenated UUID text.

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp.

    Slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    CommitSHA:
      type: string
      pattern: "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
      description: Full peeled commit object ID in the repository object format.
    CanonicalVersionTag:
      type: string
      pattern: "^v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
      description: Canonical v-prefixed SemVer tag.

    Error:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        details:
          type: string
          description: Optional safe text; clients must branch on code, not this value.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true

    LoginResult:
      type: object
      additionalProperties: false
      required: [username, token, expiresAt]
      properties:
        username:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
          description: Fixed 30-day stateless HS256 management JWT.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"

    LoginSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LoginResult"

    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          const: backend
        status:
          type: string
          const: ok

    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          const: ok
        checks:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/HealthCheck"

    HealthSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Health"

    TokenPreset:
      type: string
      enum: [sub-read, git-clone, git-write]
      description: Cumulative subscription/Git capability; never broader than the owner's current authorization.

    TokenStatus:
      type: string
      enum: [active, expired, revoked]

    TokenMetadata:
      type: object
      additionalProperties: false
      required: [id, name, preset, status, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          description: Trimmed human-readable name, limited by the runtime to 128 UTF-8 bytes.
        preset:
          $ref: "#/components/schemas/TokenPreset"
        status:
          $ref: "#/components/schemas/TokenStatus"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"

    CreateTokenRequest:
      type: object
      required: [name, preset]
      properties:
        name:
          type: string
          minLength: 1
          description: Trimmed value must be nonempty and at most 128 UTF-8 bytes.
        preset:
          $ref: "#/components/schemas/TokenPreset"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: Optional expiration strictly later than creation time.

    RevealTokenRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true

    RevealedToken:
      type: object
      additionalProperties: false
      required: [id, name, preset, status, expiresAt, lastUsedAt, revokedAt, createdAt, token]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
          minLength: 1
          description: Trimmed human-readable name, limited by the runtime to 128 UTF-8 bytes.
        preset:
          $ref: "#/components/schemas/TokenPreset"
        status:
          $ref: "#/components/schemas/TokenStatus"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        token:
          type: string
          minLength: 48
          maxLength: 48
          pattern: "^mpsk_[A-Za-z0-9_-]{43}$"
          description: Repeatably revealable plaintext PAT.

    CreatedTokenSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RevealedToken"

    RevealedTokenSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RevealedToken"

    PluginStatus:
      type: string
      enum: [draft, active, archived]
      description: First successful Version publish activates draft; archive is explicitly reversible.
    PluginVisibility:
      type: string
      enum: [public, private]
    RepositoryStatus:
      type: string
      enum: [ready, readOnly, error]
      description: Safe operational state of the mandatory hidden same-ID Repository.
    Plugin:
      type: object
      required: [namespace, name, status, visibility, repositoryStatus, cloneUrl, defaultVersion, createdAt, updatedAt]
      properties:
        namespace:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/Slug"
        status:
          $ref: "#/components/schemas/PluginStatus"
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
        repositoryStatus:
          $ref: "#/components/schemas/RepositoryStatus"
        cloneUrl:
          type: string
          pattern: "^/git/[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*\\.git$"
          description: Same-origin relative development Git URL; no Repository ID or storage detail.
        defaultVersion:
          oneOf:
            - $ref: "#/components/schemas/CanonicalVersionTag"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreatePluginRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Slug"
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
    SetPluginVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
    PluginSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Plugin"

    PluginVersionStatus:
      type: string
      const: available
      description: Deleted logical Versions are omitted from lists and return a 410 error for an authorized exact query.
    PluginVersion:
      type: object
      required: [tag, status, commitSha, publishedAt, updatedAt]
      properties:
        tag:
          $ref: "#/components/schemas/CanonicalVersionTag"
        status:
          $ref: "#/components/schemas/PluginVersionStatus"
        commitSha:
          $ref: "#/components/schemas/CommitSHA"
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    PublishPluginVersionRequest:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: "#/components/schemas/CanonicalVersionTag"
        makeDefault:
          type: boolean
          default: false
    PluginVersionSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginVersion"

    PageMeta:
      type: object
      additionalProperties: false
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0

    TokenPageData:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TokenMetadata"
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0

    PluginPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Plugin"
    PluginVersionPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PluginVersion"
    TokenPageSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenPageData"
    PluginPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginPageData"
    PluginVersionPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginVersionPageData"
