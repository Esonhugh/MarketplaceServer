openapi: 3.1.0
info:
  title: MarketplaceServer Management API Design
  version: 1.0.0-proposed
  description: |
    Proposed management API contract. Operations in this document are design
    targets and are not evidence that routes, handlers, persistence, or frontend
    flows are deployed. Deployed behavior is documented separately in
    `management-v1.yaml`.

    Git Smart HTTP, distribution endpoints, and Claude Code `marketplace.json`
    are separate request-plane contracts.
  license:
    name: MIT
    identifier: MIT
  x-document-status: proposed
  x-runtime-availability: not-guaranteed
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /

tags:
  - name: Authentication
    description: Frontend password login and JWT issuance.
  - name: Health
    description: Management-plane process health.
  - name: Personal access tokens
    description: Current-user CLI and automation credentials.
  - name: Plugins
    description: User-facing Plugins backed by hidden one-to-one Git repositories.
  - name: Plugin versions
    description: Canonical tag-driven Plugin publication.
  - name: Marketplaces
    description: Marketplace templates and mutable Plugin-tag drafts.
  - name: Marketplace revisions
    description: Retained Plugin-tag configurations and stable activation.
  - name: Distribution credentials
    description: Per-user, per-Marketplace installation credentials.

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in to the management frontend
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A fixed 30-day frontend JWT was issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/health:
    get:
      operationId: getManagementHealth
      tags: [Health]
      summary: Get management-plane health
      security: []
      responses:
        "200":
          description: Management-plane health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccess"

  /api/v1/me/tokens:
    get:
      operationId: listPersonalAccessTokens
      tags: [Personal access tokens]
      summary: List the current user's personal access tokens
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Exact owner-scoped token page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPersonalAccessToken
      tags: [Personal access tokens]
      summary: Create a personal access token
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token created; plaintext remains owner-revealable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTokenSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      operationId: revokePersonalAccessToken
      tags: [Personal access tokens]
      summary: Revoke an owner-scoped personal access token
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Token revoked idempotently; response body is empty.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/me/tokens/{tokenId}/reveal:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    post:
      operationId: revealPersonalAccessToken
      tags: [Personal access tokens]
      summary: Reveal an owner-scoped personal access token
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealTokenRequest"
      responses:
        "200":
          description: Token plaintext and metadata, including inactive status, were returned to its owner.
          headers:
            Cache-Control:
              $ref: "#/components/headers/SecretCacheControl"
            Pragma:
              $ref: "#/components/headers/SecretPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedTokenSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      operationId: listPlugins
      tags: [Plugins]
      summary: List readable Plugins in a namespace
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable namespace-scoped Plugin page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPlugin
      tags: [Plugins]
      summary: Create a Plugin and its hidden shared-ID repository
      description: |
        The lowercase kebab-case name is the immutable Plugin slug and Git path.
        Visibility defaults to public. A 201 is synchronous and is returned only
        after the same-UUID hidden bare repository is initialized with symbolic
        HEAD pointing to main and both aggregate SQL rows are ready. SQL and Git
        remain separate atomic boundaries with explicit compensation.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginRequest"
      responses:
        "201":
          description: Draft Plugin and hidden Repository aggregate created and ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    get:
      operationId: getPlugin
      tags: [Plugins]
      summary: Get Plugin metadata
      security:
        - {}
        - BearerJWT: []
      responses:
        "200":
          description: Exact public active/archived metadata is anonymous; draft/private require authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:archive:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: archivePlugin
      tags: [Plugins]
      summary: Archive a Plugin idempotently
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Plugin is archived or was already archived; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:restore:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: restorePlugin
      tags: [Plugins]
      summary: Restore an archived Plugin to its prior lifecycle state
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Plugin restored to its recorded draft or active state; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}:set-visibility:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: setPluginVisibility
      tags: [Plugins]
      summary: Set current Plugin visibility idempotently
      description: Existing Marketplace index configuration is not rewritten; current content access always re-evaluates plugin.read.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPluginVisibilityRequest"
      responses:
        "204":
          description: Visibility set or already equal; no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    get:
      operationId: listPluginVersions
      tags: [Plugin versions]
      summary: List available logical tag Versions
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable page excluding deleted tombstones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions:publish:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    post:
      operationId: publishPluginVersion
      tags: [Plugin versions]
      summary: Publish an existing canonical v-prefixed SemVer tag
      description: |
        Strictly revalidates the current canonical tag, exact manifest name and
        full SHA. CAS publication creates or restores the same logical Plugin+tag
        Version. The first successful publish activates a draft Plugin.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPluginVersionRequest"
      responses:
        "201":
          description: Logical Version published at its CAS-verified current SHA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions/{tag}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
      - $ref: "#/components/parameters/TagName"
    get:
      operationId: getPluginVersion
      tags: [Plugin versions]
      summary: Get an exact logical Version
      security:
        - {}
        - BearerJWT: []
      responses:
        "200":
          description: Available Version metadata under current Plugin visibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginVersionSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/versions/{tag}:set-default:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
      - $ref: "#/components/parameters/TagName"
    post:
      operationId: setDefaultPluginVersion
      tags: [Plugin versions]
      summary: Set the owner-selected default Version
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Available tag is now default or already was; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/plugins/{plugin}/default-version:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/PluginSlug"
    delete:
      operationId: clearDefaultPluginVersion
      tags: [Plugin versions]
      summary: Clear the owner-selected default Version idempotently
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Default is clear or was already empty; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/namespaces/{namespace}/marketplaces:
    parameters:
      - $ref: "#/components/parameters/Namespace"
    get:
      operationId: listMarketplaces
      tags: [Marketplaces]
      summary: List Marketplace templates in a namespace
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable namespace-scoped Marketplace page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplacePageSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createMarketplace
      tags: [Marketplaces]
      summary: Create a Marketplace template
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMarketplaceRequest"
      responses:
        "201":
          description: Marketplace template created with an empty draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
    get:
      operationId: getMarketplace
      tags: [Marketplaces]
      summary: Get a Marketplace template and current draft
      security:
        - BearerJWT: []
      responses:
        "200":
          description: Marketplace template and Plugin-tag draft selection.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSuccess"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceMarketplaceDraft
      tags: [Marketplaces]
      summary: Replace the mutable Plugin-tag draft selection
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceMarketplaceDraftRequest"
      responses:
        "200":
          description: Draft replaced.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      operationId: deleteMarketplace
      tags: [Marketplaces]
      summary: Delete or archive a Marketplace template
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Marketplace deletion command completed; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}:publish:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
    post:
      operationId: publishMarketplaceRevision
      tags: [Marketplace revisions]
      summary: Publish the current Plugin-tag draft as a revision
      description: |
        A revision retains an immutable ordered Plugin plus tag configuration.
        Its generated projections follow the tags' current SHAs and are rebuilt
        when a selected tag moves. The unresolved Git-ref/database-pointer
        failure boundary blocks implementation of this workflow.
      security:
        - BearerJWT: []
      responses:
        "201":
          description: Revision configuration published and selected as stable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceRevisionSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}/revisions:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
    get:
      operationId: listMarketplaceRevisions
      tags: [Marketplace revisions]
      summary: List retained Marketplace revision configurations
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Stable revision page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceRevisionPageSuccess"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}/revisions/{revisionId}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
      - $ref: "#/components/parameters/RevisionId"
    get:
      operationId: getMarketplaceRevision
      tags: [Marketplace revisions]
      summary: Get a retained Plugin-tag revision configuration
      security:
        - BearerJWT: []
      responses:
        "200":
          description: Revision configuration and current projection state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceRevisionSuccess"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}/revisions/{revisionId}:activate:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
      - $ref: "#/components/parameters/RevisionId"
    post:
      operationId: activateMarketplaceRevision
      tags: [Marketplace revisions]
      summary: Switch stable distribution to an existing revision
      description: Historical revisions are expected to have current rebuilt projections for their selected tags.
      security:
        - BearerJWT: []
      responses:
        "200":
          description: Stable selection switched to the requested revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceRevisionSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}/credentials:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
    get:
      operationId: listDistributionCredentials
      tags: [Distribution credentials]
      summary: List the current user's credentials for one Marketplace
      security:
        - BearerJWT: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Metadata-only credential page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionCredentialPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDistributionCredential
      tags: [Distribution credentials]
      summary: Create a per-user, per-Marketplace distribution credential
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDistributionCredentialRequest"
      responses:
        "201":
          description: Credential created according to its owning system contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDistributionCredentialSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/namespaces/{namespace}/marketplaces/{marketplace}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/Namespace"
      - $ref: "#/components/parameters/MarketplaceSlug"
      - $ref: "#/components/parameters/CredentialId"
    delete:
      operationId: revokeDistributionCredential
      tags: [Distribution credentials]
      summary: Revoke an owner-scoped distribution credential
      security:
        - BearerJWT: []
      responses:
        "204":
          description: Credential revoked; no body.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateless 30-day HS256 management JWT containing username, iat, and exp only.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    PluginSlug:
      name: plugin
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    MarketplaceSlug:
      name: marketplace
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    TagName:
      name: tag
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalVersionTag"
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string

  headers:
    RequestId:
      required: true
      description: Framework-generated ULID request correlation identifier for error responses.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ETag:
      required: true
      schema:
        type: string
    SecretCacheControl:
      required: true
      description: Prevents storage of a secret-bearing response.
      schema:
        type: string
        const: private, no-store
    SecretPragma:
      required: true
      description: Compatibility cache prevention for a secret-bearing response.
      schema:
        type: string
        const: no-cache

  responses:
    Unauthenticated:
      description: Authentication is missing, invalid, expired, or revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The current principal is not authorized for this action and resource.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The scoped resource was not found or is intentionally not disclosed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource state, version, or unique identity conflicts with the command.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The authorized exact logical Version is retained only as a deleted tombstone; no deleted metadata is disclosed.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The required body is missing, too large, unreadable, malformed, top-level null, or contains a trailing JSON value.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Request syntax or business input is invalid.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal failure without implementation detail disclosure.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    UUID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Timestamp:
      type: string
      format: date-time
    Slug:
      type: string
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    CommitSHA:
      type: string
      pattern: "^[0-9a-f]{40}$"
    CanonicalVersionTag:
      type: string
      pattern: "^v(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)\\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$"
      description: Canonical v-prefixed SemVer tag.

    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        details:
          type: string
          description: Optional safe human-readable detail; clients must branch on code, not this text.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true
    LoginResult:
      type: object
      required: [username, token, expiresAt]
      properties:
        username:
          type: string
        token:
          type: string
          description: Fixed 30-day stateless HS256 frontend JWT containing username, iat, and exp.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    LoginSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LoginResult"

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
    HealthSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Health"

    TokenPreset:
      type: string
      enum: [sub-read, git-clone, git-write]
      description: Cumulative subscription/Git capability; it never expands the owner's current resource authorization.
    TokenStatus:
      type: string
      enum: [active, expired, revoked]
    TokenMetadata:
      type: object
      required: [id, name, preset, status, expiresAt, lastUsedAt, revokedAt, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        preset:
          $ref: "#/components/schemas/TokenPreset"
        status:
          $ref: "#/components/schemas/TokenStatus"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lastUsedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    CreateTokenRequest:
      type: object
      required: [name, preset]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        preset:
          $ref: "#/components/schemas/TokenPreset"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    RevealTokenRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          writeOnly: true
    RevealedToken:
      allOf:
        - $ref: "#/components/schemas/TokenMetadata"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              pattern: "^mpsk_[A-Za-z0-9_-]{43}$"
              description: Repeatably revealable plaintext PAT.
    CreatedTokenSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RevealedToken"
    RevealedTokenSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RevealedToken"

    PluginStatus:
      type: string
      enum: [draft, active, archived]
      description: First successful Version publish activates draft; archive is explicitly reversible.
    PluginVisibility:
      type: string
      enum: [public, private]
    RepositoryStatus:
      type: string
      enum: [ready, readOnly, error]
      description: Safe operational state of the mandatory hidden same-ID Repository.
    Plugin:
      type: object
      required: [namespace, name, status, visibility, repositoryStatus, cloneUrl, defaultVersion, createdAt, updatedAt]
      properties:
        namespace:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/Slug"
        status:
          $ref: "#/components/schemas/PluginStatus"
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
        repositoryStatus:
          $ref: "#/components/schemas/RepositoryStatus"
        cloneUrl:
          type: string
          pattern: "^/git/[a-z0-9]+(?:-[a-z0-9]+)*/[a-z0-9]+(?:-[a-z0-9]+)*\\.git$"
          description: Same-origin relative development Git URL; no Repository ID or storage detail.
        defaultVersion:
          oneOf:
            - $ref: "#/components/schemas/CanonicalVersionTag"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreatePluginRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Slug"
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
    SetPluginVisibilityRequest:
      type: object
      required: [visibility]
      properties:
        visibility:
          $ref: "#/components/schemas/PluginVisibility"
    PluginSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Plugin"

    PluginVersionStatus:
      type: string
      const: available
      description: Deleted logical Versions are omitted from lists and return a 410 error for an authorized exact query.
    PluginVersion:
      type: object
      required: [tag, status, commitSha, publishedAt, updatedAt]
      properties:
        tag:
          $ref: "#/components/schemas/CanonicalVersionTag"
        status:
          $ref: "#/components/schemas/PluginVersionStatus"
        commitSha:
          $ref: "#/components/schemas/CommitSHA"
        publishedAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    PublishPluginVersionRequest:
      type: object
      required: [tag]
      properties:
        tag:
          $ref: "#/components/schemas/CanonicalVersionTag"
        makeDefault:
          type: boolean
          default: false
    PluginVersionSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginVersion"

    MarketplaceSelection:
      type: object
      required: [pluginId, tag]
      properties:
        pluginId:
          $ref: "#/components/schemas/UUID"
        tag:
          $ref: "#/components/schemas/CanonicalVersionTag"
    Marketplace:
      type: object
      required: [id, namespace, name, publicKey, draft, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        namespace:
          $ref: "#/components/schemas/Slug"
        name:
          $ref: "#/components/schemas/Slug"
        publicKey:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*-[0-9a-f]{8}$"
        draft:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceSelection"
        stableRevisionId:
          oneOf:
            - $ref: "#/components/schemas/UUID"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreateMarketplaceRequest:
      type: object
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Slug"
    ReplaceMarketplaceDraftRequest:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MarketplaceSelection"
    MarketplaceSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Marketplace"

    MarketplaceRevision:
      type: object
      required: [id, marketplaceId, plugins, projectionState, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        marketplaceId:
          $ref: "#/components/schemas/UUID"
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/MarketplaceSelection"
        projectionState:
          type: string
          enum: [building, ready, failed]
          description: Derived projection state; revision Plugin-tag configuration is retained.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    MarketplaceRevisionSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MarketplaceRevision"

    DistributionCredential:
      type: object
      required: [id, name, username, marketplaceId, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        username:
          type: string
          description: Non-secret Marketplace credential username.
        marketplaceId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revokedAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    CreateDistributionCredentialRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    CreatedDistributionCredential:
      allOf:
        - $ref: "#/components/schemas/DistributionCredential"
        - type: object
          required: [password]
          properties:
            password:
              type: string
              format: uuid
              writeOnly: true
              description: Plaintext distribution password; repeatable reveal remains subject to the distribution-credential system design.
    CreatedDistributionCredentialSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CreatedDistributionCredential"

    PageMeta:
      type: object
      required: [page, size, total]
      properties:
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    TokenPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TokenMetadata"
    PluginPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Plugin"
    PluginVersionPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/PluginVersion"
    MarketplacePageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Marketplace"
    MarketplaceRevisionPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MarketplaceRevision"
    DistributionCredentialPageData:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/DistributionCredential"

    TokenPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TokenPageData"
    PluginPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginPageData"
    PluginVersionPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PluginVersionPageData"
    MarketplacePageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MarketplacePageData"
    MarketplaceRevisionPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MarketplaceRevisionPageData"
    DistributionCredentialPageSuccess:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DistributionCredentialPageData"
